[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
exclude = ["migrations"]

[tool.black]
line-length = 88
target-version = ["py312"]
exclude = "migrations"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
